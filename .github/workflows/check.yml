name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: permission_test
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: permission_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permission_test -d permission_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
      - name: Isolated PostgreSQL workflow
        env:
          TEST_DATABASE_DSN: host=127.0.0.1 port=5432 user=permission_test password=isolated-ci-fixture dbname=permission_center_test sslmode=disable
        run: go test ./internal/integration -count=1 -v
      - run: go build ./...
