  responses:
    HTTP400:
      description: "Bad Request"
      headers:
        x-request-id:
          schema:
            type: "string"
            maxLength: 128
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            code: 400
            msg: "Bad Request"
            data: null
    HTTP401:
      description: "Unauthorized"
      headers:
        x-request-id:
          schema:
            type: "string"
            maxLength: 128
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
