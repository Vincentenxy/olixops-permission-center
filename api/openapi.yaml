components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "本地RS256 JWT，验证exp/iss/aud，sub为内部UUID，另核对用户状态。"
    SystemToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "opc_<keyId>.<secret>"
      description: "独立系统 Token 入口，不能调用管理员API；不接受管理员JWT作为系统身份。"
  parameters:
    RequestID:
      name: "x-request-id"
      in: "header"
      required: false
      schema:
        type: "string"
        maxLength: 128
      description: "1–128可见ASCII字节原样透传；不合法或缺失由服务端生成；响应头回写。"
  schemas:
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required: ["code","msg","data"]
      properties:
        code:
          type: "integer"
        msg:
          type: "string"
        data:
          nullable: true
          example: null
    BusinessError:
      type: "object"
      additionalProperties: false
      required: ["code","msg","data"]
      properties:
        code:
          type: "integer"
          enum: [-1]
        msg:
          type: "string"
        data:
          nullable: true
          example: null
    UserProfile:
      type: "object"
      additionalProperties: false
      required: ["userId","username","name","platformRole"]
      properties:
        userId:
          type: "string"
          format: "uuid"
        username:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 128
        platformRole:
          type: "string"
          enum: ["none","platform_admin"]
    LoginRequest:
      type: "object"
      additionalProperties: false
      required: ["username","password"]
      properties:
        username:
          type: "string"
          maxLength: 64
          minLength: 1
        password:
          type: "string"
          maxLength: 72
          minLength: 1
          format: "password"
          writeOnly: true
    LoginResult:
      type: "object"
      additionalProperties: false
      required: ["accessToken","expiresAt","user"]
      properties:
        accessToken:
          type: "string"
        expiresAt:
          type: "string"
          format: "date-time"
        user:
          "$ref": "#/components/schemas/UserProfile"
    User:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","username","name","platformRole","status","remark"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        username:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 128
        platformRole:
          type: "string"
          enum: ["none","platform_admin"]
        status:
          type: "string"
          enum: ["active","disabled"]
        remark:
          type: "string"
          maxLength: 2000
    Tenant:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","code","name","remark","status"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        code:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 128
        remark:
          type: "string"
          maxLength: 2000
        status:
          type: "string"
          enum: ["active","disabled"]
    System:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","tenantId","code","name","remark","status"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        tenantId:
          type: "string"
          format: "uuid"
        code:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 128
        remark:
          type: "string"
          maxLength: 2000
        status:
          type: "string"
          enum: ["active","disabled"]
    Account:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","systemId","name","status"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        systemId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          maxLength: 128
        status:
          type: "string"
          enum: ["active","disabled"]
    SystemDetail:
      type: "object"
      additionalProperties: false
      required: ["system","account"]
      properties:
        system:
          "$ref": "#/components/schemas/System"
        account:
          "$ref": "#/components/schemas/Account"
    Member:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","tenantId","userId","username","name","memberRole","status"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        tenantId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        username:
          type: "string"
          maxLength: 64
        name:
          type: "string"
          maxLength: 128
        memberRole:
          type: "string"
          enum: ["tenant_admin"]
        status:
          type: "string"
          enum: ["active","disabled"]
    Credential:
      type: "object"
      additionalProperties: false
      required: ["id","version","createAt","updateAt","accountId","keyId","name","status","revokedAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        createAt:
          type: "string"
          format: "date-time"
        updateAt:
          type: "string"
          format: "date-time"
        accountId:
          type: "string"
          format: "uuid"
        keyId:
          type: "string"
          maxLength: 32
        name:
          type: "string"
          maxLength: 128
        status:
          type: "string"
          enum: ["active","revoked"]
        revokedAt:
          type: "string"
          format: "date-time"
          nullable: true
    IssuedCredential:
      type: "object"
      additionalProperties: false
      required: ["credential","token"]
      properties:
        credential:
          "$ref": "#/components/schemas/Credential"
        token:
          type: "string"
          description: "仅创建成功时展示一次；固定 Token，不自动过期。"
    SystemIdentity:
      type: "object"
      additionalProperties: false
      required: ["tenantId","systemId","accountId","keyId"]
      properties:
        tenantId:
          type: "string"
          format: "uuid"
        systemId:
          type: "string"
          format: "uuid"
        accountId:
          type: "string"
          format: "uuid"
        keyId:
          type: "string"
          maxLength: 32
    Audit:
      type: "object"
      additionalProperties: false
      required: ["id","actorType","actorId","actorName","tenantId","tenantName","systemId","systemName","accountId","keyId","targetType","targetId","targetName","action","result","reasonCode","requestId","changes","createAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        actorType:
          type: "string"
          enum: ["user","system_account","bootstrap","anonymous"]
        actorId:
          type: "string"
          format: "uuid"
          nullable: true
        actorName:
          type: "string"
          maxLength: 128
        tenantId:
          type: "string"
          format: "uuid"
          nullable: true
        tenantName:
          type: "string"
          maxLength: 128
        systemId:
          type: "string"
          format: "uuid"
          nullable: true
        systemName:
          type: "string"
          maxLength: 128
        accountId:
          type: "string"
          format: "uuid"
          nullable: true
