openapi: "3.0.3"
info:
  title: "Olixops Permission Center"
  version: "0.2.0"
  description: "一期后台：本地登录、租户/管理员/系统管理、固定系统 Token、审计。管理成功写入与审计同事务。SpiceDB 业务授权接口不在本版本范围。严格 JSON，未知字段及尾随 JSON 拒绝，body上限64KiB。"
servers:
  - url: "http://localhost:8080"
paths:
  "/api/v1/pub/healthz":
    get:
      summary: "进程连通性；不代表数据库或授权业务就绪"
      operationId: "health"
      security: []
      parameters:
        - "$ref": "#/components/parameters/RequestID"
      responses:
        "200":
          description: "成功 code=0；普通业务拒绝可能返回 HTTP200/code=-1。"
          content:
            "application/json":
              schema:
                oneOf:
                  - type: "object"
                    additionalProperties: false
                    required: ["code","msg","data"]
                    properties:
                      code:
                        type: "integer"
                        enum: [0]
                      msg:
                        type: "string"
                      data:
                        "$ref": "#/components/schemas/Health"
                  - "$ref": "#/components/schemas/BusinessError"
        "400":
          "$ref": "#/components/responses/HTTP400"
        "401":
          "$ref": "#/components/responses/HTTP401"
        "403":
          "$ref": "#/components/responses/HTTP403"
        "404":
          "$ref": "#/components/responses/HTTP404"
        "409":
          "$ref": "#/components/responses/HTTP409"
        "503":
          "$ref": "#/components/responses/HTTP503"
  "/api/v1/pub/auth/login":
